appId: cn.deepwrite.desktop
productName: DeepWrite
artifactName: "${productName}-${version}-${os}-${arch}-test.${ext}"

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
beforeBuild: ./scripts/electron-builder-before-build.cjs

publish:
  provider: generic
  url: https://github.com/swjybky/deepwrite/releases/latest/download
  channel: latest

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  notarize: false

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepWrite
  deleteAppDataOnUninstall: false
